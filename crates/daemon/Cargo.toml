[package]
name = "afrolink-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "afrolinkd: the node binary. Assembles a store, a consensus driver, a peer-to-peer transport and a query server into something that runs."

[lib]
name = "afrolink_daemon"
path = "src/lib.rs"

[[bin]]
name = "afrolinkd"
path = "src/main.rs"

[dependencies]
afrolink-primitives.workspace = true
afrolink-crypto.workspace = true
afrolink-consensus.workspace = true
afrolink-executor.workspace = true
afrolink-state.workspace = true
afrolink-node.workspace = true
afrolink-p2p.workspace = true
afrolink-store.workspace = true
afrolink-rpc.workspace = true
afrolink-http.workspace = true
hex.workspace = true
thiserror.workspace = true
getrandom.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
afrolink-types.workspace = true

[lints]
workspace = true
