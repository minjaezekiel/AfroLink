[workspace]
resolver = "3"
members = ["crates/primitives", "crates/crypto", "crates/state", "crates/types", "crates/bank", "crates/executor", "crates/consensus", "crates/node", "crates/light", "crates/store", "crates/rpc", "crates/alias", "crates/pay", "crates/witness", "crates/fuzz", "crates/staking", "crates/http", "crates/gov", "crates/p2p", "crates/daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/afrolink/afrolink"
authors = ["AfroLink Contributors"]

[workspace.dependencies]
afrolink-primitives = { path = "crates/primitives" }
afrolink-crypto = { path = "crates/crypto" }
afrolink-state = { path = "crates/state" }
afrolink-types = { path = "crates/types" }
afrolink-bank = { path = "crates/bank" }
afrolink-executor = { path = "crates/executor" }
afrolink-consensus = { path = "crates/consensus" }
afrolink-node = { path = "crates/node" }
afrolink-light = { path = "crates/light" }
afrolink-store = { path = "crates/store" }
afrolink-rpc = { path = "crates/rpc" }
afrolink-alias = { path = "crates/alias" }
afrolink-pay = { path = "crates/pay" }
afrolink-witness = { path = "crates/witness" }
afrolink-fuzz = { path = "crates/fuzz" }
afrolink-staking = { path = "crates/staking" }
afrolink-http = { path = "crates/http" }
afrolink-gov = { path = "crates/gov" }
afrolink-p2p = { path = "crates/p2p" }
afrolink-daemon = { path = "crates/daemon" }

blake3 = "1.8"
ed25519-dalek = "3.0"
getrandom = "0.3"
thiserror = "2.0"
hex = "0.4"
redb = "4.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# A `Result` that nobody looks at is a failure that nobody handled. This is a
# deny rather than the default warn because of a specific defect: the cluster
# harness held the flag that says "this node cannot write its own chain" and
# never read it, so a failed store write was silent and surfaced much later as
# an unexplained sync stall. `Driver::step` now returns that condition, and this
# is what makes returning it mean something.
unused_must_use = "deny"

[workspace.lints.clippy]
# Consensus-critical code must never panic on untrusted input.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
